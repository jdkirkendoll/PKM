<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PDF Library</title>
    <style>
      body {
        width: 360px;
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      button {
        font-family: inherit;
      }
      button#save,
      button#save-selected-tabs {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      button#save:disabled,
      button#save-selected-tabs:disabled {
        background: #93c5fd;
        cursor: default;
      }
      button.secondary {
        width: 100%;
        margin-top: 6px;
        padding: 7px;
        font-size: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: white;
        color: #333;
        cursor: pointer;
      }
      #status {
        font-size: 12px;
        color: #555;
        margin-top: 6px;
        min-height: 14px;
      }
      #tabs-panel {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #eee;
      }
      .tabs-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #888;
        margin-bottom: 4px;
      }
      .tabs-actions a {
        color: #2563eb;
        text-decoration: none;
        margin-left: 4px;
      }
      ul#tabs-list {
        list-style: none;
        margin: 0 0 6px;
        padding: 0;
        max-height: 160px;
        overflow-y: auto;
        border: 1px solid #eee;
        border-radius: 6px;
      }
      #tabs-list li {
        border-bottom: 1px solid #f0f0f0;
      }
      #tabs-list li:last-child {
        border-bottom: none;
      }
      #tabs-list label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 6px;
        cursor: pointer;
      }
      .tab-title {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tabs-progress {
        font-size: 11px;
        color: #555;
        margin-top: 4px;
        min-height: 14px;
      }
      .settings-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #eee;
      }
      .segmented {
        display: flex;
        border: 1px solid #ddd;
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented button {
        border: none;
        background: white;
        color: #333;
        font-size: 11px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .segmented button + button {
        border-left: 1px solid #ddd;
      }
      .segmented button.active {
        background: #2563eb;
        color: white;
      }
      input#filter {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin: 12px 0 6px;
        font-size: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      ul#list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 280px;
        overflow-y: auto;
      }
      li {
        padding: 6px 4px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
      }
      li:hover {
        background: #f5f5f5;
      }
      .title {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        font-size: 11px;
        color: #888;
      }
      .empty {
        font-size: 12px;
        color: #999;
        text-align: center;
        padding: 16px 0;
      }
      #clear {
        font-size: 11px;
        color: #999;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px 0;
      }
    </style>
  </head>
  <body>
    <h1>PDF Page Library</h1>
    <button id="save">Save this page as PDF</button>
    <button id="save-tabs-toggle" class="secondary">Select tabs to save&hellip;</button>
    <div id="status"></div>

    <div id="tabs-panel" hidden>
      <div class="tabs-header">
        <span id="tabs-count"></span>
        <span class="tabs-actions"><a href="#" id="select-all">All</a><a href="#" id="select-none">None</a></span>
      </div>
      <ul id="tabs-list"></ul>
      <button id="save-selected-tabs" disabled>Save selected tabs</button>
      <div id="tabs-progress"></div>
    </div>

    <div class="settings-row">
      <span>If already saved:</span>
      <div id="duplicate-toggle" class="segmented">
        <button data-value="skip">Skip</button>
        <button data-value="update">Update</button>
      </div>
    </div>

    <input id="filter" type="text" placeholder="Filter saved pages..." />
    <ul id="list"></ul>
    <button id="clear">Clear library index</button>
    <script src="popup.js"></script>
  </body>
</html>
